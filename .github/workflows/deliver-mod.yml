name: Deliver Mod

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0699f-gdshare

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  deliver:
    name: Commit built mod
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0699f-gdshare

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Stage the .geode file
        run: |
          mkdir -p dist
          find "${{ steps.build.outputs.build-output }}" -name '*.geode' -exec cp {} dist/ \;
          ls -l dist
          sha256sum dist/*.geode

      - name: Commit the mod
        run: |
          git config user.name "ci-deliver"
          git config user.email "ci-deliver@users.noreply.github.com"
          git add -f dist/*.geode
          git commit -m "ci: publish built .geode [skip ci]" || exit 0
          git push origin HEAD:arena/01a0699f-gdshare
